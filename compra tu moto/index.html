<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>compro moto</title>
</head>
<body>
    <main>
        <section class="formu">
            <h1>Compra de una moto</h1>
            <article>
                <section>
                    <section class="inpus">
                        <label for="prc">Valor de moto:</label>
                    <input type="number" name="precio" id="prc" min="99" >
                    </section >
                    <h2 class="inpus">Seleccione cuotas DESEADAS</h2>
                    <section class="inpus">
                        <label for="tresCuo">En 3 cuotas:</label>
                        <input type="radio" name="cuo" id="tresCuo">
                    </section>
                    <section class="inpus">
                        <label for="seisCuo">En 6 cuotas:</label>
                        <input type="radio" name="cuo" id="seisCuo">
                    </section>
                    <section class="inpus">
                        <label for="nueveCuo">En 9 cuotas:</label>
                        <input type="radio" name="cuo" id="nueveCuo">
                    </section>
                    <section class="inpus">
                        <label for="doceCuo">En 12 cuotas:</label>
                        <input type="radio" name="cuo" id="doceCuo">
                    </section>
                    <section>
                        <p id="tot">Total a pagar:</p>
                    </section>
                </section>
            </article>
        </section>
    </main>
    <script src="JS/java.js" ></script>
</body>
</html>
