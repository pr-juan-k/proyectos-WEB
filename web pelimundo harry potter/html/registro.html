        <section>
        
        <form action="#" method="post">
            <h2>Cargue el siguiente formulario para crear su suscripcion por favor!</h2>
            
            <section class="secform">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="NombreUsuario" placeholder="Jose Esteban" required>
             <label for="mail">Mail</label>
            <input type="email" name="mailUsuario" id="mail" placeholder="mmm@.gmail.com" required>
            <label for="passw">Contraseña:</label>
            <input type="password" id="passw" name="contraseña" required>
            </section>


            <section class="secform">
            <label for="Fech">Fecha de nacimiento:</label>
            <input type="date" name="Fecha" id="Fech">

            <label for="pais">Pais:</label>
            <select name="paisUsuario" id="pais">
                <option value="">Argentina</option>
                <option value="">Brasil</option>
                <option value="">Francia</option>

            </select >
            
            <legend>¿Desea resibir novedades y promociones?</legend>
            <label>
                <input type="radio" name="opcion" value="opcion1" class="radioOpcion"> Opción 1
              </label>
              <label>
                <input type="radio" name="opcion" value="opcion2" class="radioOpcion"> Opción 2
              </label>
            

            <input class="btest" type="submit" value="Suscribir">
            </section>
        </form>
        </section>

    </article>

    <aside >
        <h2>¿Algun inconveniente? CONTACTANOS...</h2>
        <form action="#" method="get" id="formAsunto">
            <label for="emailUsuari">deje su Email por favor:</label>

            </section>
            <section>

            <input type="text" name="asunto-A-tratar" id="asunto">
           </section>
           <section>
            <label for="asunto">Describenos:</label>
            <textarea name="descripcion" id="asunto" cols="30" rows="10"></textarea>
            </section>

            <input type="submit" value="Enviar">
